name: Deploy production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: porcupine_directory
          POSTGRES_USER: porcupine
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U porcupine -d porcupine_directory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://porcupine:ci-only-password@localhost:5432/porcupine_directory
      TEST_DATABASE_URL: postgres://porcupine:ci-only-password@localhost:5432/porcupine_directory
      APP_ORIGIN: http://localhost:4350
      SESSION_SECRET: ci-only-session-secret-that-is-long-enough
      FSP_SYNC_ENABLED: "false"
      PUBLICATION_SYNC_ENABLED: "false"
      SMTP_MODE: smtp
      STAFF_AUTH_MODE: session
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run release checks
        run: npm run release:check
      - name: Run synchronization integration checks
        run: npm run test:sync
      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://porcupinedirectory.com
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Create release archive
        run: git archive --format=tar.gz --output "$RUNNER_TEMP/porcupine-directory.tar.gz" "$GITHUB_SHA"
      - name: Check deployment configuration
        env:
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER }}
          DEPLOY_PATH: ${{ vars.PRODUCTION_PATH }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 0600 "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
      - name: Upload release
        env:
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER }}
          DEPLOY_PATH: ${{ vars.PRODUCTION_PATH }}
        run: |
          set -Eeuo pipefail
          ssh_options=(-i "$RUNNER_TEMP/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15)
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 0750 '$DEPLOY_PATH/releases/$GITHUB_SHA'"
          scp "${ssh_options[@]}" "$RUNNER_TEMP/porcupine-directory.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$GITHUB_SHA/release.tar.gz"
      - name: Configure Lightning donation environment
        env:
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER }}
          DEPLOY_PATH: ${{ vars.PRODUCTION_PATH }}
          DONATION_LIGHTNING_ADDRESS: ${{ vars.DONATION_LIGHTNING_ADDRESS }}
          DONATION_LIGHTNING_NWC_URL: ${{ secrets.DONATION_LIGHTNING_NWC_URL }}
        run: |
          set -Eeuo pipefail
          ssh_options=(-i "$RUNNER_TEMP/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15)
          remote_env="$DEPLOY_PATH/.donation.env"
          if [[ -z "$DONATION_LIGHTNING_ADDRESS" && -z "$DONATION_LIGHTNING_NWC_URL" ]]; then
            ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -f '$remote_env'"
            exit 0
          fi
          test -n "$DONATION_LIGHTNING_ADDRESS"
          test -n "$DONATION_LIGHTNING_NWC_URL"
          test "$DONATION_LIGHTNING_NWC_URL" != *"'"*
          umask 077
          local_env="$RUNNER_TEMP/donation.env"
          {
            printf 'DONATION_LIGHTNING_ADDRESS=%s\n' "$DONATION_LIGHTNING_ADDRESS"
            printf "DONATION_LIGHTNING_NWC_URL='%s'\n" "$DONATION_LIGHTNING_NWC_URL"
            printf 'DONATION_LIGHTNING_MIN_MSAT=1000\n'
            printf 'DONATION_LIGHTNING_MAX_MSAT=1000000000\n'
            printf 'DONATION_LIGHTNING_EXPIRY_SECONDS=3600\n'
            printf "DONATION_LIGHTNING_MEMO='Porcupine Directory donation'\n"
          } > "$local_env"
          scp "${ssh_options[@]}" "$local_env" "$DEPLOY_USER@$DEPLOY_HOST:$remote_env.$GITHUB_SHA"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 0600 '$remote_env.$GITHUB_SHA' && mv -f '$remote_env.$GITHUB_SHA' '$remote_env'"
      - name: Activate release
        env:
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER }}
          DEPLOY_PATH: ${{ vars.PRODUCTION_PATH }}
        run: |
          set -Eeuo pipefail
          ssh_options=(-i "$RUNNER_TEMP/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15)
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$DEPLOY_PATH' '$GITHUB_SHA'" < deploy/install-release.sh
