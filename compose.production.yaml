name: porcupine-directory

# Use with:
#   docker compose --env-file .env.production -f compose.yaml -f compose.production.yaml up -d --build
# The production environment file must provide the required values below.
services:
  db:
    ports: !reset []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env.production} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}",
        ]

  migrate:
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL:?Set ADMIN_DATABASE_URL in .env.production}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.production}
      START_SERVER: "false"
    command: ["node", "dist-server/server/migrate-cli.js"]

  app:
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: !override
      - "127.0.0.1:${APP_HOST_PORT:-4350}:3000"
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:?Set APP_DATABASE_URL in .env.production}
      RUN_MIGRATIONS: "false"
      APP_ORIGIN: ${APP_ORIGIN:?Set the canonical HTTPS APP_ORIGIN in .env.production}
      SESSION_SECRET: ${SESSION_SECRET:?Set a persistent SESSION_SECRET in .env.production}
      STAFF_AUTH_MODE: ${STAFF_AUTH_MODE:-session}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SUBMISSION_POLICY: ${SUBMISSION_POLICY:-published}
      PASSKEYS_ENABLED: ${PASSKEYS_ENABLED:-false}
      FSP_SYNC_ENABLED: ${FSP_SYNC_ENABLED:-true}
      PUBLICATION_SYNC_ENABLED: ${PUBLICATION_SYNC_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_MODE: ${SMTP_MODE:-smtp}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:-}
      DONATION_BITCOIN_ADDRESS: ${DONATION_BITCOIN_ADDRESS:-}
      DONATION_LIGHTNING_ADDRESS: ${DONATION_LIGHTNING_ADDRESS:-}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - porcupine-caddy-data:/data
      - porcupine-caddy-config:/config

volumes:
  porcupine-caddy-data:
  porcupine-caddy-config:
